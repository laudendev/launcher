[package]
name = "lauden-dev-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
quartermaster-license = { path = "../quartermaster-license" }
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
eframe = "0.36.1"
egui = "0.36.1"
arboard = "3.6.1"
image = "0.25.10"

[profile.release]
strip = true
lto = true
