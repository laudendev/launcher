[package]
name = "lauden-dev-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
quartermaster-license = { path = "../quartermaster-license" }
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
strip = true
lto = true
